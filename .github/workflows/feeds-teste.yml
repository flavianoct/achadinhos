name: Testar feeds de ofertas

# Só lê feeds RSS de ofertas e mostra quais funcionam e quantas ofertas do ML trazem. Não posta nem grava nada.
on:
  pull_request:
    paths:
      - 'testar-feeds.mjs'
      - '.github/workflows/feeds-teste.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Sondar os feeds
        run: node testar-feeds.mjs | tee feeds.txt
