name: Robô de ofertas

on:
  schedule:
    # A cada meia hora, só no horário de postagem: 8h às 23h em Brasília = 11h às 2h59 UTC.
    # Se mudar HORA_INICIO ou HORA_FIM em ajustes.env, ajuste as horas aqui também.
    - cron: '7,37 11-23,0-2 * * *'
    # Reforço da manhã: o agendador do GitHub às vezes atrasa ou pula disparos, e a primeira rodada do dia
    # chegou a sair 2 horas depois das 8h. Estes disparos extras só valem se ainda não houver rodada em andamento.
    - cron: '17,27,47,57 11 * * *'
  # Permite rodar na hora pelo botão "Run workflow" da aba Actions.
  workflow_dispatch:

permissions:
  contents: write   # guardar o banco de dados no ramo "dados"
  pages: write      # publicar o blog
  id-token: write   # exigido pela publicação no GitHub Pages
  models: read      # IA gratuita do GitHub, que escreve os posts
  actions: write    # a rodada chama a próxima (veja o job "proxima")

# Nunca duas rodadas ao mesmo tempo: a segunda espera a primeira terminar.
concurrency:
  group: robo
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar o ffmpeg (monta o vídeo do Reel)
        # Se falhar, o robô segue normalmente e só não publica o Reel do dia.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
        continue-on-error: true

      - name: Instalar o conversor de imagens
        # Só o @resvg/resvg-js (arte de Story e feed em PNG). Se falhar, o robô segue sem as imagens do Instagram.
        run: npm install --omit=dev --no-audit --no-fund
        continue-on-error: true

      - name: Recuperar o banco de dados
        run: |
          if git ls-remote --exit-code --heads origin dados >/dev/null; then
            git fetch --depth=1 origin dados
            git show FETCH_HEAD:dados.db > dados.db
            echo "Banco recuperado: $(du -h dados.db | cut -f1)"
          else
            codigo=$?
            # 2 = o ramo ainda não existe (primeira execução). Qualquer outro código é falha de rede:
            # melhor parar do que começar um banco vazio e apagar o histórico.
            if [ "$codigo" -ne 2 ]; then
              echo "Não consegui consultar o ramo de dados (código $codigo)."
              exit 1
            fi
            echo "Primeira execução: banco novo."
          fi

      - name: Preparar o GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        # Se o Pages ainda não foi ligado, o robô roda mesmo assim; só o blog não é publicado.
        continue-on-error: true

      - name: Rodar o robô
        id: robo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          ML_MATT_WORD: ${{ secrets.ML_MATT_WORD }}
          ML_MATT_TOOL: ${{ secrets.ML_MATT_TOOL }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          BLOG_URL: ${{ steps.pages.outputs.base_url }}
        run: node --disable-warning=ExperimentalWarning src/index.ts --nuvem

      - name: Guardar o banco de dados
        # Roda mesmo se o robô terminou com erro, para não perder o que já foi coletado e postado.
        if: always() && steps.robo.outcome != 'skipped' && hashFiles('dados.db') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pasta=$(mktemp -d)
          cp dados.db "$pasta/"
          cd "$pasta"
          git init -q -b dados
          git config user.name "achadinhos-bot"
          git config user.email "achadinhos-bot@users.noreply.github.com"
          git add dados.db
          git commit -q -m "Banco de dados do robô"
          # Um único commit, sempre substituído: o histórico do repositório não cresce.
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dados

      - name: Enviar o blog
        if: always() && steps.pages.outcome == 'success' && hashFiles('blog/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: blog

      - name: Publicar o blog
        id: publicar
        if: always() && steps.pages.outcome == 'success' && hashFiles('blog/index.html') != ''
        uses: actions/deploy-pages@v4

      - name: Aviso sobre o Pages
        if: always() && steps.pages.outcome != 'success'
        run: echo "::warning::O blog não foi publicado porque o GitHub Pages ainda não está ligado. Vá em Settings → Pages e escolha Source = GitHub Actions."

  # O agendamento do GitHub (cron) é impreciso e às vezes não dispara. Para o robô não depender dele,
  # cada rodada espera um pouco e chama a próxima. O cron acima continua como reserva.
  # Para PARAR o robô: aba Actions -> Robô de ofertas -> menu ... -> Disable workflow.
  proxima:
    needs: rodar
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Esperar e chamar a próxima rodada
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fora do horário de postagem não há o que fazer: o ciclo pára e o cron retoma de manhã.
          inicio=$(grep -E '^HORA_INICIO=' ajustes.env | cut -d= -f2 | tr -d '\r ')
          fim=$(grep -E '^HORA_FIM=' ajustes.env | cut -d= -f2 | tr -d '\r ')
          hora=$(TZ=America/Sao_Paulo date -d '+25 minutes' +%-H)
          if [ "$hora" -lt "${inicio:-8}" ] || [ "$hora" -ge "${fim:-23}" ]; then
            echo "A próxima rodada cairia às ${hora}h, fora do horário (${inicio:-8}h às ${fim:-23}h). Ciclo pausado até o cron de manhã."
            exit 0
          fi
          sleep 1500
          gh workflow run robo.yml --repo "$GITHUB_REPOSITORY" --ref main
