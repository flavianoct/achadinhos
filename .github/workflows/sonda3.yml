name: Sonda 3 do Mercado Livre

on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ler estrutura dos cartoes
        run: |
          cat > sonda3.mjs <<'JS'
          const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36';
          const x = await fetch('https://www.mercadolivre.com.br/ofertas', { headers: { 'user-agent': UA, 'accept-language': 'pt-BR,pt;q=0.9', accept: 'text/html' } });
          const html = await x.text();
          const m = html.match(/<script[^>]*id="__NORDIC_RENDERING_CTX__"[^>]*>([\s\S]*?)<\/script>/);
          const s = m ? m[1] : '';
          console.log('len', s.length);
          console.log('head:', s.slice(0, 200));
          console.log('tail:', s.slice(-120));
          let data;
          try { data = JSON.parse(s.slice(s.indexOf('{'), s.indexOf('};_n.ctx.r.') + 1)); } catch (e) { console.log('parse fail', e.message); }
          if (data) {
            const achados = [];
            let total = 0;
            (function walk(o, path) {
              if (!o || typeof o !== 'object') return;
              if (o.metadata && o.pictures) { total++; if (achados.length < 2) achados.push({ path, o }); return; }
              for (const k of Object.keys(o)) walk(o[k], path + '.' + k);
            })(data, '');
            console.log('cards total', total);
            for (const a of achados) { console.log('path', a.path); console.log(JSON.stringify(a.o).slice(0, 6000)); }
          }
          const mm = html.match(/"pagination"[^}]{0,300}/);
          console.log('pagination', mm ? mm[0] : 'nenhum');
          JS
          node sonda3.mjs
