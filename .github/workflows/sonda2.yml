name: Sonda 2 do Mercado Livre

on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Analisar a pagina de ofertas
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: |
          cat > sonda2.mjs <<'JS'
          const API = 'https://api.mercadolibre.com';
          const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36';
          const r = await fetch(API + '/oauth/token', { method: 'POST', headers: { 'content-type': 'application/x-www-form-urlencoded', accept: 'application/json' }, body: new URLSearchParams({ grant_type: 'client_credentials', client_id: (process.env.ML_CLIENT_ID || '').trim(), client_secret: (process.env.ML_CLIENT_SECRET || '').trim() }).toString() });
          const t = await r.json();
          console.log('token:', r.status, t.access_token ? 'ok' : JSON.stringify(t).slice(0, 150));
          const auth = { authorization: 'Bearer ' + t.access_token, accept: 'application/json' };
          async function pagina(url) {
            const x = await fetch(url, { headers: { 'user-agent': UA, 'accept-language': 'pt-BR,pt;q=0.9', accept: 'text/html' } });
            return { status: x.status, html: await x.text() };
          }
          const p = await pagina('https://www.mercadolivre.com.br/ofertas');
          const html = p.html;
          console.log('ofertas:', p.status, 'bytes', html.length, 'poly-card', (html.match(/poly-card/g) || []).length);
          const ids = [...new Set([...html.matchAll(/MLB-?(\d{8,})/g)].map((m) => m[1]))];
          console.log('ids:', ids.length, ids.slice(0, 10).join(','));
          const scripts = [...html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/g)].filter((m) => /json|state/i.test(m[1]) || m[2].length > 5000).map((m) => m[1].trim().slice(0, 80) + ' len=' + m[2].length);
          console.log('scripts:', scripts.slice(0, 10).join(' | '));
          const links = [...new Set([...html.matchAll(/https:\/\/(?:produto|www)\.mercadolivre\.com\.br\/[^"'\s<>\\]+/g)].map((m) => m[0]))];
          console.log('links:', links.length);
          for (const l of links.slice(0, 8)) console.log('  ' + l.slice(0, 160));
          const i1 = html.indexOf('poly-card');
          console.log('trecho poly-card:', i1 < 0 ? 'nenhum' : html.slice(i1, i1 + 900).replace(/\s+/g, ' '));
          const i2 = html.indexOf('andes-money-amount__fraction');
          console.log('trecho preco:', i2 < 0 ? 'nenhum' : html.slice(i2 - 200, i2 + 200).replace(/\s+/g, ' '));
          const i3 = html.indexOf('"price"');
          console.log('trecho json price:', i3 < 0 ? 'nenhum' : html.slice(i3 - 300, i3 + 300).replace(/\s+/g, ' '));
          for (const id of ids.slice(0, 3)) {
            for (const caminho of ['/items/MLB' + id, '/products/MLB' + id, '/items?ids=MLB' + id]) {
              const x = await fetch(API + caminho, { headers: auth });
              console.log('[token] ' + x.status + ' ' + caminho + ' -> ' + (await x.text()).replace(/\s+/g, ' ').slice(0, 200));
            }
          }
          const p2 = await pagina('https://www.mercadolivre.com.br/ofertas?page=2');
          console.log('ofertas p2:', p2.status, 'bytes', p2.html.length, 'ids', new Set([...p2.html.matchAll(/MLB-?(\d{8,})/g)].map((m) => m[1])).size);
          if (links[0]) {
            const pp = await pagina(links[0]);
            console.log('pagina de produto:', pp.status, 'bytes', pp.html.length, 'og:image', (pp.html.match(/property="og:image" content="([^"]+)"/) || [])[1], 'titulo', (pp.html.match(/<title>([^<]+)/) || [])[1]);
          }
          JS
          node sonda2.mjs
