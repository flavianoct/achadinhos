<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Barlow:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;overflow:hidden}
body{height:1350px;background:#0E0E10;color:#fff;font-family:'Barlow',Arial,sans-serif;position:relative;
  background-image:radial-gradient(900px 620px at 50% -120px,rgba(225,6,0,.75),transparent 70%)}
body.story{height:1920px}
.disp{font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:-.01em}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;padding-top:54px}
.logo svg{width:92px;height:92px}
.logo .disp{font-size:74px;line-height:1;display:flex;gap:.18em}
.pr{position:relative;color:#FFD60A}
.pr::after{content:'';position:absolute;left:-4%;right:-4%;top:46%;height:.09em;background:#E10600;border-radius:.05em;transform:rotate(-5deg);box-shadow:0 0 0 .03em #0E0E10}
h1{font-size:150px;line-height:.9;text-align:center;margin:46px 40px 0}
h1 span{color:#FFD60A;display:block}
.sub{text-align:center;font-size:44px;font-weight:700;margin-top:26px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin:50px 50px 0}
.card{background:#fff;border-radius:10px 34px 34px 34px;padding:16px 16px 20px;position:relative;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.card img{width:100%;aspect-ratio:1/1;object-fit:contain;display:block}
.card b{display:block;color:#111;font-size:32px;font-weight:800;line-height:1.1;margin-top:10px;text-align:center}
.tag{position:absolute;top:-20px;right:-10px;background:#E10600;color:#fff;font-size:28px;font-weight:800;padding:8px 18px;border-radius:999px;box-shadow:0 6px 14px rgba(0,0,0,.35)}
.pts{display:flex;justify-content:center;gap:34px;margin-top:46px;font-size:36px;font-weight:700}
.pts span::before{content:'✓';color:#FFD60A;font-weight:800;margin-right:10px}
.cta{position:absolute;left:50px;right:50px;bottom:70px;background:#FFD60A;color:#0E0E10;border-radius:30px;text-align:center;padding:30px 20px 34px;font-size:84px;line-height:1}
.mini{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:26px;font-weight:600;color:#A9A9B3}
body.story .logo{padding-top:230px}
body.story h1{font-size:164px;margin-top:70px}
body.story .grid{margin-top:80px}
body.story .pts{margin-top:50px;flex-direction:column;align-items:center;gap:12px;font-size:44px}
body.story .cta{bottom:250px}
body.story .mini{bottom:192px;font-size:30px}
</style>
<body>
<script>if(location.hash==='#story')document.body.className='story'</script>
<div class="logo">
  <svg viewBox="0 0 200 200"><g transform="rotate(-18 100 100)"><path d="M26 100 L74 50 H164 Q176 50 176 62 V138 Q176 150 164 150 H74 Z" fill="#E10600" stroke="#E10600" stroke-width="10" stroke-linejoin="round"/><circle cx="70" cy="100" r="10" fill="#0E0E10"/></g><path d="M128 10 L82 106 H112 L90 190 L154 84 H122 L146 10 Z" fill="#FFD60A" stroke="#0E0E10" stroke-width="10" stroke-linejoin="round" paint-order="stroke"/></svg>
  <div class="disp"><span>Mata</span><span class="pr">Preço</span></div>
</div>
<h1 class="disp">Pague menos<span>todo dia</span></h1>
<p class="sub">Ofertas e cupons direto no seu WhatsApp</p>
<div class="grid">
  <div class="card"><span class="tag">🔥 Oferta</span><img src="airfryer.jpg"><b>Air Fryer</b></div>
  <div class="card"><span class="tag">🔥 Oferta</span><img src="fone.jpg"><b>Fone Bluetooth</b></div>
  <div class="card"><span class="tag">🔥 Oferta</span><img src="panela.jpg"><b>Panela de pressão</b></div>
</div>
<div class="pts"><span>Grátis</span><span>Só os admins postam</span><span>Saia quando quiser</span></div>
<div class="cta disp">Entre no grupo grátis</div>
<p class="mini">Exemplos de ofertas enviadas no grupo. Os preços mudam todo dia.</p>
</body>
