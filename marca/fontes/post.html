<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
  body { width: 1080px; height: 1350px; overflow: hidden; background: var(--black); padding: 56px; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo .sym { width: 96px; height: 96px; }
  .logo .wm { font-size: 72px; }
  .loja { font-weight: 800; font-size: 26px; letter-spacing: .12em; text-transform: uppercase; border: 3px solid #3A3A42; color: #D5D5DC; padding: 12px 22px; border-radius: 999px; }
  .foto { flex: 1; margin: 40px 0 36px; border-radius: 36px; background: repeating-linear-gradient(135deg, #1B1B1F 0 28px, #202026 28px 56px); border: 3px dashed #3A3A42; display: flex; align-items: center; justify-content: center; position: relative; }
  .foto span { font-weight: 700; letter-spacing: .2em; color: #5C5C66; font-size: 30px; text-transform: uppercase; }
  .selo { position: absolute; top: -26px; right: 36px; background: var(--red); font-family: 'Barlow Condensed'; font-style: italic; font-weight: 900; font-size: 110px; line-height: 1; padding: 18px 34px 22px 26px; border-radius: 26px; transform: rotate(5deg); box-shadow: 0 14px 0 var(--red-dark); }
  h1 { font-weight: 800; font-size: 50px; line-height: 1.1; }
  .precos { display: flex; align-items: flex-end; gap: 30px; margin-top: 18px; }
  .de { font-size: 38px; color: var(--gray); font-weight: 600; text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 5px; padding-bottom: 20px; }
  .por { font-family: 'Barlow Condensed'; font-style: italic; font-weight: 900; font-size: 190px; line-height: .85; color: var(--yellow); }
  .por small { font-size: .42em; margin-right: 10px; }
  footer { margin-top: 34px; background: var(--yellow); color: var(--black); font-weight: 800; font-size: 34px; text-transform: uppercase; letter-spacing: .06em; text-align: center; padding: 24px; border-radius: 22px; }
</style>
<body>
  <header>
    <div class="logo"><div class="sym" data-tag="#E10600" data-cut="#0E0E10"></div><div class="wm"><span class="a">Mata</span><span class="b">Preço</span></div></div>
    <div class="loja">Nome da loja</div>
  </header>
  <div class="foto"><span>Foto do produto</span><div class="selo">-55%</div></div>
  <h1>Nome do produto em até duas linhas</h1>
  <div class="precos"><div class="de">de R$ 199,90</div><div class="por"><small>R$</small>89,90</div></div>
  <footer>Link no grupo · Mata Preço Oficial</footer>
<script src="brand.js"></script>
</body>
